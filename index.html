<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Sucursales</title>
  <style>
    :root {
      --verde-neufeld: #5C9232;
      --verde-neufeld-hover: #4a7728;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* Título Editable */
    .title-container {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .editable-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2c3e50;
      padding: 0.5rem;
      border: 2px dashed transparent;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .editable-title:hover, .editable-title:focus {
      border-color: var(--verde-neufeld);
      background-color: #f9fbf8;
    }

    /* Acciones */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 2rem;
    }

    /* Botones de acción */
    button {
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background-color: #e74c3c;
      color: white;
    }

    .btn-reset:hover { background-color: #c0392b; }

    .btn-mode {
      background-color: #7f8c8d;
      color: white;
    }

    /* Estilo cuando está en modo nube */
    .btn-mode.compartido {
      background-color: #2980b9;
      box-shadow: 0 0 8px rgba(41, 128, 185, 0.5);
    }

    /* Indicador de estado */
    #statusIndicator {
      font-size: 0.8rem;
      margin-top: 5px;
      color: #7f8c8d;
      text-align: center;
      height: 15px;
    }

    /* Grid de Sucursales */
    .grid-sucursales {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }

    .btn-sucursal {
      background-color: #f8f9fa;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 0.8rem 0.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .btn-sucursal:hover {
      border-color: var(--verde-neufeld);
    }

    .btn-sucursal.activo {
      background-color: var(--verde-neufeld);
      border-color: var(--verde-neufeld);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(92, 146, 50, 0.3);
    }

    .btn-sucursal.activo:hover {
      background-color: var(--verde-neufeld-hover);
      border-color: var(--verde-neufeld-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-container">
      <h1 class="editable-title" id="pageTitle" contenteditable="true" spellcheck="false">
        Control de Sucursales
      </h1>
      <div id="statusIndicator">Modo Local activo</div>
    </div>

    <div class="actions">
      <button class="btn-mode" id="btnMode">Modo: Local</button>
      <button class="btn-reset" id="btnReset">Reiniciar</button>
    </div>

    <div class="grid-sucursales" id="gridSucursales">
      <!-- Generado dinámicamente -->
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyKQosz6LNHUO2c_V1q0ds-ri8zMFVy7tzPnBZ9U8oIockXNxRvG-AA_iAG4IPZ3-5f/exec';
    
    // Claves Locales
    const STORAGE_TITLE_KEY = 'sucursales_titulo';
    const STORAGE_STATE_KEY = 'sucursales_marcadas';

    const sucursales = [
      "ACA", "AER", "ALC", "ALT", "AME", "ASL", "ATE", "ATO", 
      "BUG", "CGR", "CHA", "CON", "COL", "CPI", "CRE", "EIG", 
      "ETE", "FED", "GAL", "GCO", "GUA", "HIS", "IND", "ING", 
      "JUA", "LCA", "LPA", "LPL", "MOT", "NOB", "OBL", "POR", 
      "PSO", "RCE", "REV", "RMI", "RPL", "SFE", "SIS", "SLU", 
      "TEC", "TES", "TET", "TLA", "TON", "TRA"
    ];

    const gridContainer = document.getElementById('gridSucursales');
    const btnReset = document.getElementById('btnReset');
    const btnMode = document.getElementById('btnMode');
    const pageTitle = document.getElementById('pageTitle');
    const statusIndicator = document.getElementById('statusIndicator');

    let activeSucursales = new Set();
    const htmlButtons = {};
    let isSharedMode = false; // Empezamos en modo local por defecto
    let syncInterval;

    // 1. INICIALIZAR INTERFAZ
    sucursales.forEach(codigo => {
      const btn = document.createElement('button');
      btn.classList.add('btn-sucursal');
      btn.innerText = codigo;
      
      btn.addEventListener('click', () => {
        btn.classList.toggle('activo');
        if (btn.classList.contains('activo')) {
          activeSucursales.add(codigo);
        } else {
          activeSucursales.delete(codigo);
        }
        guardarDatos();
      });

      htmlButtons[codigo] = btn;
      gridContainer.appendChild(btn);
    });

    // 2. LÓGICA DE GUARDADO (Depende del Modo)
    function guardarDatos() {
      if (isSharedMode) {
        statusIndicator.innerText = "Guardando en la nube...";
        const arr = Array.from(activeSucursales);
        const jsonStr = encodeURIComponent(JSON.stringify(arr));
        fetch(`${API_URL}?action=updateSucursales&sucursales=${jsonStr}`, { redirect: 'follow' })
          .then(() => statusIndicator.innerText = "Sincronizado con la nube")
          .catch(() => statusIndicator.innerText = "Error al guardar en la nube");
      } else {
        localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(Array.from(activeSucursales)));
        statusIndicator.innerText = "Guardado localmente";
      }
    }

    // 3. LÓGICA DE CARGA (Depende del Modo)
    async function cargarDatos() {
      if (isSharedMode) {
        try {
          statusIndicator.innerText = "Actualizando desde la nube...";
          const response = await fetch(`${API_URL}?action=get&t=${Date.now()}`, { redirect: 'follow' });
          const data = await response.json();
          
          if (document.activeElement !== pageTitle) pageTitle.innerText = data.title;
          activeSucursales = new Set(data.sucursales);
          statusIndicator.innerText = "Sincronizado con la nube";
        } catch (error) {
          statusIndicator.innerText = "Error de conexión. Revisa el link de Google.";
          console.error(error);
        }
      } else {
        // Carga Local
        const savedTitle = localStorage.getItem(STORAGE_TITLE_KEY);
        if (savedTitle && document.activeElement !== pageTitle) pageTitle.innerText = savedTitle;
        activeSucursales = new Set(JSON.parse(localStorage.getItem(STORAGE_STATE_KEY)) || []);
        statusIndicator.innerText = "Modo Local activo";
      }

      // Actualizar botones visualmente
      sucursales.forEach(codigo => {
        if (activeSucursales.has(codigo)) {
          htmlButtons[codigo].classList.add('activo');
        } else {
          htmlButtons[codigo].classList.remove('activo');
        }
      });
    }

    // 4. CAMBIAR DE MODO
    btnMode.addEventListener('click', () => {
      isSharedMode = !isSharedMode;
      
      if (isSharedMode) {
        btnMode.innerText = "Modo: Compartido";
        btnMode.classList.add('compartido');
        cargarDatos(); // Carga lo de la nube
        syncInterval = setInterval(cargarDatos, 5000); // Sincroniza cada 5s
      } else {
        btnMode.innerText = "Modo: Local";
        btnMode.classList.remove('compartido');
        clearInterval(syncInterval); // Detiene la sincronización
        cargarDatos(); // Carga lo local
      }
    });

    // 5. EDICIÓN DEL TÍTULO
    let timeoutId;
    pageTitle.addEventListener('input', () => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        if (isSharedMode) {
          const newTitle = encodeURIComponent(pageTitle.innerText);
          fetch(`${API_URL}?action=updateTitle&title=${newTitle}`, { redirect: 'follow' });
        } else {
          localStorage.setItem(STORAGE_TITLE_KEY, pageTitle.innerText);
        }
      }, 1000);
    });

    // 6. REINICIAR
    btnReset.addEventListener('click', () => {
      activeSucursales.clear();
      sucursales.forEach(codigo => htmlButtons[codigo].classList.remove('activo'));
      
      if (isSharedMode) {
        fetch(`${API_URL}?action=updateSucursales&sucursales=[]`, { redirect: 'follow' });
      } else {
        localStorage.removeItem(STORAGE_STATE_KEY);
      }
    });

    // Iniciar cargando la versión local por defecto
    cargarDatos();

  </script>
</body>
</html>
